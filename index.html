<!DOCTYPE html>
<html lang="en" class="h-full bg-pink-50 text-slate-700">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Board Game Slot Machine ✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pop: {
                            pink: '#ffb6c1',
                            pinkLight: '#fff0f3',
                            pinkDark: '#ff69b4',
                            lavender: '#e6e6fa',
                            lavenderDark: '#b8a1d9',
                            mint: '#d8f3dc',
                            mintDark: '#74c69d',
                            peach: '#ffdab9',
                            cream: '#fffaf0'
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Quicksand', 'sans-serif']
                    },
                    boxShadow: {
                        'pop-soft': '0 10px 25px -5px rgba(255, 105, 180, 0.2), 0 8px 10px -6px rgba(255, 105, 180, 0.1)',
                        'pop-glow': '0 0 20px rgba(255, 182, 193, 0.8)',
                        'pop-inner': 'inset 0 2px 8px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fff0f3;
            background-image: radial-gradient(#ffc8dd 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Sparkle float animation */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(10deg); }
        }
        .sparkle-float {
            animation: float-slow 3s ease-in-out infinite;
        }

        /* Slot Reel Container Styling */
        .slot-reel-box {
            position: relative;
            overflow: hidden;
            border-radius: 1.2rem;
            background: #ffffff;
            box-shadow: inset 0 0 15px rgba(255, 182, 193, 0.3), 0 8px 20px rgba(255, 182, 193, 0.2);
            border: 3px solid #ffb6c1;
        }

        /* Glass / Shine Overlay */
        .slot-reel-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.5) 0%, 
                rgba(255, 255, 255, 0) 35%, 
                rgba(255, 182, 193, 0.08) 50%, 
                rgba(255, 255, 255, 0.4) 100%);
            pointer-events: none;
            border-radius: 1rem;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        .reel-card {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .reel-card {
                height: 180px;
                padding: 0.5rem;
            }
        }

        /* Bouncy Button Effect */
        .btn-bouncy {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .btn-bouncy:hover {
            transform: translateY(-3px) scale(1.02);
        }
        .btn-bouncy:active {
            transform: translateY(2px) scale(0.98);
        }
    </style>
</head>
<body class="min-h-full flex flex-col justify-between items-center text-slate-700 pb-10">

    <!-- Navbar / Header -->
    <header class="w-full max-w-4xl px-4 pt-6 pb-2 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-2xl sparkle-float">💖</span>
            <h1 class="text-lg md:text-2xl font-black font-display text-pink-600 tracking-wide">
                GIRLY POP GAME PICKER
            </h1>
            <span class="text-2xl sparkle-float" style="animation-delay: 1.5s;">✨</span>
        </div>

        <div class="flex items-center space-x-2">
            <button id="sound-btn" class="px-3 py-1.5 rounded-full bg-white border-2 border-pink-200 text-pink-500 font-bold text-xs shadow-sm hover:bg-pink-50 transition-colors flex items-center gap-1.5">
                <i id="sound-icon" class="fa-solid fa-volume-high"></i>
                <span class="hidden sm:inline">Audio</span>
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-3xl px-2 md:px-4 flex flex-col items-center gap-6 my-auto">

        <!-- Cute Top Banner -->
        <div id="status-banner" class="w-full text-center py-3 px-4 rounded-3xl bg-white/90 border-2 border-pink-200 text-pink-600 font-extrabold text-xs md:text-base shadow-pop-soft flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i>
            <span id="status-text">Press SPIN to reveal 3 cute board game picks!</span>
        </div>

        <!-- Slot Machine Deck Frame -->
        <div class="w-full bg-white/80 backdrop-blur-md p-3 md:p-8 rounded-[2.5rem] border-4 border-pink-200 shadow-pop-soft relative">
            
            <!-- Floating Decorative Stars -->
            <i class="fa-solid fa-star text-yellow-300 text-xl absolute -top-3 -left-3 sparkle-float"></i>
            <i class="fa-solid fa-heart text-pink-400 text-xl absolute -bottom-3 -right-3 sparkle-float" style="animation-delay: 1s;"></i>

            <!-- 3 Slot Reels Grid (Forced side-by-side on mobile with grid-cols-3) -->
            <div class="grid grid-cols-3 gap-2 md:gap-6">
                
                <!-- Reel #1 Slot & Badge -->
                <div class="flex flex-col items-center gap-2 md:gap-3">
                    <div id="reel-box-0" class="slot-reel-box w-full h-[150px] md:h-[180px]">
                        <div id="reel-strip-0" class="reel-strip"></div>
                    </div>
                    <!-- Wrapping Enabled Badge -->
                    <div class="w-full py-1.5 px-2 bg-pink-100 border-2 border-pink-300 rounded-xl md:rounded-2xl text-center shadow-inner min-h-[44px] md:min-h-[48px] flex items-center justify-center">
                        <span id="label-0" class="font-extrabold text-pink-700 text-xs md:text-base whitespace-normal line-clamp-2 leading-tight">
                            ✨ Slot #1
                        </span>
                    </div>
                </div>

                <!-- Reel #2 Slot & Badge -->
                <div class="flex flex-col items-center gap-2 md:gap-3">
                    <div id="reel-box-1" class="slot-reel-box w-full h-[150px] md:h-[180px]">
                        <div id="reel-strip-1" class="reel-strip"></div>
                    </div>
                    <!-- Wrapping Enabled Badge -->
                    <div class="w-full py-1.5 px-2 bg-purple-100 border-2 border-purple-300 rounded-xl md:rounded-2xl text-center shadow-inner min-h-[44px] md:min-h-[48px] flex items-center justify-center">
                        <span id="label-1" class="font-extrabold text-purple-700 text-xs md:text-base whitespace-normal line-clamp-2 leading-tight">
                            🌸 Slot #2
                        </span>
                    </div>
                </div>

                <!-- Reel #3 Slot & Badge -->
                <div class="flex flex-col items-center gap-2 md:gap-3">
                    <div id="reel-box-2" class="slot-reel-box w-full h-[150px] md:h-[180px]">
                        <div id="reel-strip-2" class="reel-strip"></div>
                    </div>
                    <!-- Wrapping Enabled Badge -->
                    <div class="w-full py-1.5 px-2 bg-emerald-100 border-2 border-emerald-300 rounded-xl md:rounded-2xl text-center shadow-inner min-h-[44px] md:min-h-[48px] flex items-center justify-center">
                        <span id="label-2" class="font-extrabold text-emerald-700 text-xs md:text-base whitespace-normal line-clamp-2 leading-tight">
                            🎀 Slot #3
                        </span>
                    </div>
                </div>

            </div>

            <!-- Spin Button -->
            <div class="mt-6 md:mt-8 flex justify-center">
                <button id="spin-btn" class="btn-bouncy px-10 py-4 rounded-full bg-gradient-to-r from-pink-400 via-pink-500 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-black font-display text-xl md:text-2xl tracking-wider shadow-pop-glow flex items-center gap-3 border-4 border-white cursor-pointer">
                    <i class="fa-solid fa-sparkles"></i>
                    <span>SPIN!</span>
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>

        </div>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        /*

            { title: "Clue", image: "./imgs/clue.png" },

            { title: "Dreidel", image: "./imgs/dreidel.png" },
            { title: "Exploding Kittens", image: "./imgs/exploding kittens.png" },
            { title: "Exploding Minions", image: "./imgs/exploding minions.png" },
            { title: "Genius Square", image: "./imgs/genius square.png" },
            { title: "Giant Battle Ship", image: "./imgs/giant battle ship.png" },
            { title: "Giant Scrabble", image: "./imgs/giant scrabble.png" },
            { title: "Hand To Hand Wombat", image: "./imgs/hand to hand wombat.png" },
            { title: "Happy Little Dinosaur", image: "./imgs/Happy Little Dinosaur.png" },
            { title: "Hook and Ring", image: "./imgs/hook and ring.png" },
            { title: "Hues And Cues", image: "./imgs/hues and cues.png" },
            { title: "Ice Pick Japan", image: "./imgs/ice pick japan.png" },
            { title: "Incohearent", image: "./imgs/incohearent.png" },
            { title: "Life Japan", image: "./imgs/life japan.png" },
            { title: "Life", image: "./imgs/life.png" },
            { title: "Mancala", image: "./imgs/mancala.png" },
            { title: "Millennial Monopoly", image: "./imgs/millennial monopoly.png" },
            { title: "Monopoly Deal", image: "./imgs/monopoly deal.png" },
            { title: "Monopoly Vault", image: "./imgs/monopoly vault.png" },
            { title: "Mouse Trap", image: "./imgs/mouse trap.png" },
            { title: "Nerf Gun Connect 4", image: "./imgs/nerf gun connect 4.png" },
            { title: "Nice Buns", image: "./imgs/nice buns.png" },
            { title: "Origami", image: "./imgs/nice buns.png" },
            { title: "Painting Night", image: "./imgs/nice buns.png" },
            { title: "Phase 10", image: "./imgs/phase 10.png" },
            { title: "Ping Pong", image: "./imgs/ping pong.png" },
            { title: "Pokemon Labrynth", image: "./imgs/pokemon labrynth.png" },
            { title: "Pokemon Monopoly", image: "./imgs/pokemon monopoly.png" },
            { title: "Pokemon Card Game", image: "./imgs/pokemon monopoly.png" },
            { title: "Pool", image: "./imgs/pool.png" },
            { title: "Puzzle", image: "./imgs/puzzle.png" },
            { title: "Scrabble Slam", image: "./imgs/scrabble slam.png" },
            { title: "Shogi", image: "./imgs/shogi.png" },
            { title: "Skip Bo", image: "./imgs/skip bo.png" },
            { title: "Sudoku", image: "./imgs/sudoku.png" },
            { title: "Tapple", image: "./imgs/tapple.png" },
            { title: "Thai Jax", image: "./imgs/thai jax.png" },
            { title: "Throw Throw Burrito", image: "./imgs/throw throw burrito.png" },
            { title: "Tower Stack", image: "./imgs/tower stack.png" },
            { title: "Uno", image: "./imgs/uno.png" },
            { title: "Uzzle", image: "./imgs/uzzle.png" },
            { title: "Video Games", image: "./imgs/video games.png" },
            { title: "Zombie Kittens", image: "./imgs/zombie kittens.png" },
            { title: "Sims", image: "./imgs/video games.png", category: "video games" },
            { title: "Mario Kart", image: "./imgs/video games.png", category: "video games" },
            { title: "Kirby", image: "./imgs/video games.png", category: "video games" },
            { title: "Mario Party", image: "./imgs/video games.png", category: "video games" },
            { title: "Smash bros", image: "./imgs/video games.png", category: "video games" },
            { title: "Pokemon Stadium", image: "./imgs/video games.png", category: "video games" },
            { title: "Overcooked", image: "./imgs/video games.png", category: "video games" },
            { title: "Just Dance", image: "./imgs/video games.png", category: "video games" },
            { title: "Kirby Cake Race", image: "./imgs/video games.png", category: "video games" },
            { title: "Munga Munga", image: "./imgs/cards.png", category: "cards" },
            { title: "Spit", image: "./imgs/cards.png", category: "cards" },
            { title: "21 +-", image: "./imgs/cards.png", category: "cards" },
            { title: "Old Maid", image: "./imgs/cards.png", category: "cards" },
            { title: "Kings Corner", image: "./imgs/cards.png", category: "cards" },
            { title: "Black jack", image: "./imgs/cards.png", category: "cards" },
            { title: "Poker", image: "./imgs/cards.png", category: "cards" },
            { title: "BS", image: "./imgs/cards.png", category: "cards" }

        ];

        let currentWinningGames = [null, null, null];

        // Preload all images into browser memory on boot
        function preloadAllImages() {
            myBoardGames.forEach(game => {
                const img = new Image();
                img.src = game.image;
            });
        }

        class GirlyPopAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPop() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400 + Math.random() * 150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playChime() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + (i * 0.07));

                    gain.gain.setValueAtTime(0, this.ctx.currentTime + (i * 0.07));
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + (i * 0.07) + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (i * 0.07) + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + (i * 0.07));
                    osc.stop(this.ctx.currentTime + (i * 0.07) + 0.2);
                });
            }
        }

        const audio = new GirlyPopAudio();
        let isSpinning = false;

        const spinBtn = document.getElementById('spin-btn');
        const statusText = document.getElementById('status-text');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');

        function getPlaceholderImage(title) {
            const encodedTitle = encodeURIComponent(title);
            return `https://placehold.co/300x300/ffb6c1/ffffff?text=${encodedTitle}`;
        }

        // Render card with category badge if interactive
        function createSingleCardHTML(game) {
            const fallbackSrc = getPlaceholderImage(game.title);
            const hasCategory = Boolean(game.category);
            return `
                <div class="reel-card w-full h-full flex items-center justify-center p-1 relative group">
                    <div class="w-20 h-20 sm:w-24 sm:h-24 md:w-32 md:h-32 bg-pink-50 border-3 md:border-4 border-pink-200 rounded-2xl overflow-hidden shadow-md flex items-center justify-center p-1 relative ${hasCategory ? 'cursor-pointer hover:border-pink-400 hover:scale-105 transition-all' : ''}">
                        <img src="${game.image}" 
                             alt="${game.title}" 
                             onerror="this.onerror=null; this.src='${fallbackSrc}';" 
                             class="w-full h-full object-cover rounded-xl">
                        ${hasCategory ? `
                            <div class="absolute inset-0 bg-pink-500/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-xl">
                                <span class="bg-white/90 text-pink-600 font-extrabold text-[9px] md:text-[10px] px-2 py-1 rounded-full shadow-xs flex items-center gap-1 text-center">
                                    <i class="fa-solid fa-filter text-[8px]"></i> Only ${game.category}
                                </span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function getUniqueGamesFromPool(pool, count) {
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // Setup initial reels with 3 random CORE games (no categories) on boot
        function setupInitialReels() {
            const coreGames = myBoardGames.filter(g => !g.category);
            const initialGames = getUniqueGamesFromPool(coreGames, Math.min(3, coreGames.length));
            currentWinningGames = initialGames;
            for (let i = 0; i < 3; i++) {
                const strip = document.getElementById(`reel-strip-${i}`);
                strip.innerHTML = createSingleCardHTML(initialGames[i]);
                document.getElementById(`label-${i}`).textContent = `✨ ${initialGames[i].title}`;
            }
        }

        // Universal Spin Function
        function executeSpin(customPool = myBoardGames, categoryName = null) {
            if (isSpinning) return;

            if (customPool.length < 3) {
                statusText.textContent = `Need at least 3 games in this selection!`;
                return;
            }

            audio.init();
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusText.textContent = categoryName ? `💖 Spinning only ${categoryName} games! 💖` : "💖 Spinning for game night picks... 💖";

            const winningGames = getUniqueGamesFromPool(customPool, 3);
            currentWinningGames = winningGames;
            const totalDurations = [2000, 4000, 6000];

            for (let i = 0; i < 3; i++) {
                const label = document.getElementById(`label-${i}`);
                label.textContent = "Spinning...";
                label.classList.add('animate-pulse');
            }

            winningGames.forEach((winningGame, i) => {
                const strip = document.getElementById(`reel-strip-${i}`);
                const duration = totalDurations[i];
                let currentInterval = 60;
                let elapsed = 0;

                function tickReel() {
                    elapsed += currentInterval;

                    if (elapsed < duration - 400) {
                        const randomGame = customPool[Math.floor(Math.random() * customPool.length)];
                        strip.innerHTML = createSingleCardHTML(randomGame);
                        audio.playPop();
                        currentInterval = Math.min(currentInterval * 1.12, 280);
                        setTimeout(tickReel, currentInterval);
                    } else if (elapsed < duration) {
                        const randomGame = customPool[Math.floor(Math.random() * customPool.length)];
                        strip.innerHTML = createSingleCardHTML(randomGame);
                        audio.playPop();
                        currentInterval += 80;
                        setTimeout(tickReel, currentInterval);
                    } else {
                        // LAND ON WINNER
                        strip.innerHTML = createSingleCardHTML(winningGame);
                        audio.playPop();

                        const label = document.getElementById(`label-${i}`);
                        label.textContent = `✨ ${winningGame.title}`;
                        label.classList.remove('animate-pulse');

                        if (i === 2) {
                            isSpinning = false;
                            spinBtn.disabled = false;
                            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                            audio.playChime();
                            statusText.textContent = categoryName ? `🎉 Showing 3 ${categoryName} games! 🎉` : "🎉 Tap any categorized game card to filter all 3 slots! 🎉";
                        }
                    }
                }

                tickReel();
            });
        }

        function initEvents() {
            // Main Spin button ONLY spins from core games (items without a category)
            spinBtn.addEventListener('click', () => {
                const coreGamesOnly = myBoardGames.filter(g => !g.category);
                executeSpin(coreGamesOnly, null);
            });

            // Clicking any of the 3 final slots checks its category
            for (let i = 0; i < 3; i++) {
                document.getElementById(`reel-box-${i}`).addEventListener('click', () => {
                    if (isSpinning) return;

                    const clickedGame = currentWinningGames[i];
                    if (!clickedGame || !clickedGame.category) {
                        // Does nothing if the game has no category!
                        return; 
                    }

                    // Filter all games matching this category
                    const categoryPool = myBoardGames.filter(g => g.category === clickedGame.category);
                    
                    // Re-spin ALL 3 slots using only this category's values
                    executeSpin(categoryPool, clickedGame.category);
                });
            }

            soundBtn.addEventListener('click', () => {
                audio.enabled = !audio.enabled;
                if (audio.enabled) {
                    soundIcon.className = 'fa-solid fa-volume-high';
                    soundBtn.classList.remove('opacity-50');
                } else {
                    soundIcon.className = 'fa-solid fa-volume-xmark';
                    soundBtn.classList.add('opacity-50');
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            preloadAllImages();
            setupInitialReels();
            initEvents();
        });
    </script>
</body>
